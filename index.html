<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!-- The guest app is Mr Green; /gm stays Rally75 and swaps this back in useGmManifest. -->
    <script>
      if (!location.pathname.startsWith('/gm')) document.documentElement.dataset.brand = 'mrgreen'
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#033317" />
    <meta name="description" content="Trav, skrap och andra sätt att bli av med pengar." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Guest manifest. /gm swaps this to gm.webmanifest so the two home-screen icons open
         their own app (iOS follows the manifest's start_url when you add to the home screen). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mr Green" />
    <!-- "black", not "black-translucent": iOS then reserves the status bar strip, so the bonus
         bar cannot render underneath the clock. Nothing in src/ handles safe-area-inset-top. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:site_name" content="Mr Green Nätcasino" />
    <meta property="og:title" content="Mr Green Nätcasino" />
    <meta property="og:description" content="Trav, skrap och andra sätt att bli av med pengar." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Mr Green Nätcasino</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
